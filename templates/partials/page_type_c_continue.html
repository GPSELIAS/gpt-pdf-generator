<section class="page page--content tc-page tc-page--continue">
  <div class="tc-header-band" aria-hidden="true"></div>
  <div class="tc-left-band" aria-hidden="true"></div>

  <img class="tc-header-logo tc-header-logo--continue" src="assets/gpsholding.png" alt="GPS Group Holding" />
  <div class="tc-header-left tc-header-left--continue">GPS Group Holding</div>
  <div class="tc-header-right tc-header-right--continue">Nister GmbH 2026</div>

  <div class="tc-chapter tc-chapter--continue">
    <div class="tc-chapter__title tc-chapter__title--continue {{ section.title_variant|default('tc-title--lg') }}">{{ section.title }}</div>
    {% if section.subheading %}
      <div class="tc-chapter__subtitle tc-chapter__subtitle--continue">{{ section.subheading }}</div>
    {% endif %}
  </div>

  <div class="tc-body-left tc-body-left--continue prose">
    {{ section.body_left | safe }}
  </div>

  <div class="tc-footer-line" aria-hidden="true"></div>
  <div class="tc-footer-left">{{ footer_text|default("Kompetenz und Qualität auf höchstem Niveau") }}</div>
  <div class="tc-footer-page">{{ section.page_number|default("") }}</div>
  <div class="tc-footer-page-underline" aria-hidden="true"></div>
</section>
