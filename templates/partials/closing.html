<section class="page page--closing">
  <div class="closing-bg" aria-hidden="true">
    <img src="assets/abschluss.png" alt="" />
  </div>

  <div class="closing-overlay" aria-hidden="true"></div>

  <div class="closing-content">
    <div class="closing-title">{{ end_title }}</div>
    <p class="closing-text">{{ end_text }}</p>
  </div>

  <div class="closing-footer">
    <div class="contact-grid">
      <div class="contact">
        <div class="contact__label">Address</div>
        <p class="contact__value">{{ address }}</p>
      </div>

      <div class="contact">
        <div class="contact__label">Telephone</div>
        <p class="contact__value">{{ telephone }}</p>
      </div>

      <div class="contact">
        <div class="contact__label">Website</div>
        <p class="contact__value">{{ website }}</p>
      </div>
    </div>
  </div>
</section>
